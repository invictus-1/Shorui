[package]
name = "shorui"
version = "0.2.0"
edition = "2024"
description = "A fast PDF reader and editor"

[dependencies]
crossbeam-channel = "0.5.17"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.37.0"
pdfium-render = { version = "0.9.5", default-features = false, features = ["pdfium_latest"] }
rfd = "0.18.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[workspace]
members = ["installer"]

[build-dependencies]
embed-resource = "3.0.12"
